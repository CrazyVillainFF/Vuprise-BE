services:
  - type: web
    name: nexora-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PASSWORD_RESET_PEPPER
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: CLIENT_URL
        value: https://nexora-lac-three.vercel.app
      - key: ALLOWED_CLIENT_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PASSWORD_RESET_FROM
        value: vupriseofficial@gmail.com
      - key: BREVO_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
  - type: cron
    name: vuprise-inactivity-reminders
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node scripts/sendInactivityReminders.js
    schedule: "*/30 * * * *"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: PASSWORD_RESET_FROM
        value: vupriseofficial@gmail.com
      - key: CLIENT_URL
        value: https://nexora-lac-three.vercel.app
